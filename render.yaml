services:
  - type: web
    name: launchops-api
    runtime: node
    plan: free
    rootDir: backend
    # NODE_ENV=production makes npm omit devDependencies by default. TypeScript is a
    # build-time devDependency, so explicitly install it instead of letting npx fetch
    # an incompatible latest compiler during the Render build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: MONGODB_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        value: https://launchops-app.vercel.app
